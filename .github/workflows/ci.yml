name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - run: ./target/release/git3ready rules --no-color
      # Self-scan: files that quote the patterns are in .git3readyignore, so
      # anything new elsewhere fails the build.
      - run: ./target/release/git3ready scan . --fail-on info --no-color
      # Dogfood: the test suite also has to pass under the Git 3.0 defaults.
      - run: ./target/release/git3ready rehearse -- cargo test --all
