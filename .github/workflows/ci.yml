name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - run: ./target/release/git3ready rules --no-color
      # Self-scan: files that quote the patterns are in .git3readyignore, so
      # anything new elsewhere fails the build.
      - run: ./target/release/git3ready scan . --fail-on info --no-color
      # Dogfood: the test suite also has to pass under the Git 3.0 defaults.
      - run: ./target/release/git3ready rehearse -- cargo test --all

  # The oldest Rust this crate promises to build with (rust-version in
  # Cargo.toml). A dependency update that needs a newer one fails here.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version goes in `toolchain` on @master (the action's README), not
      # in the ref: Dependabot would "update" a ref like @1.88 to the newest.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo test --locked --all
